<body>

<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 26px; color: #1D304E; letter-spacing: -0.5px">raise</span>
<span style="font-family: Montserrat, sans-serif; font-weight: 600; font-size: 26px; color: #137F79; letter-spacing: -0.5px">clínica</span>
</a>
<nav class="navlinks" aria-label="Principal">
<a href="#especialidades" style="color: #3E5068; text-decoration: none; font-size: 15px; font-weight: 500">Especialidades</a>
<a href="#jornada" style="color: #3E5068; text-decoration: none; font-size: 15px; font-weight: 500">Atendimento IA</a>
<a href="#conselheiro" style="color: #3E5068; text-decoration: none; font-size: 15px; font-weight: 500">Conselheiro</a>
<a href="#demo" style="color: #3E5068; text-decoration: none; font-size: 15px; font-weight: 500">Por dentro</a>
<a href="#planos" style="color: #3E5068; text-decoration: none; font-size: 15px; font-weight: 500">Planos</a>
</nav>
<a href="#contato" style="background: #1D304E; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 15px; padding: 12px 20px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Agendar demonstração</a>
</div>
</header>

<!-- HERO -->
<section id="topo" style="background: #EEF6F6; padding: 64px 0 104px; overflow: hidden">
<div class="hero" style="max-width: 1200px; margin: 0 auto; padding: 0 32px">
<div style="display: flex; flex-direction: column; gap: 24px">
<span style="align-self: flex-start; font-size: 14px; font-weight: 700; color: #0E6B66; background: #D6EFED; padding: 8px 14px; border-radius: 999px">Para clínicas médicas, odontológicas e de estética</span>

<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #3E5068; max-width: 560px">A IA acolhe, qualifica e agenda o paciente no WhatsApp 24 horas, confirma a consulta e chama de volta quem sumiu. Toda semana, o Conselheiro mostra onde a sua clínica está perdendo agenda e faturamento.</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600; color: #3E5068">Veja um exemplo da sua especialidade:</span>
<div style="display: inline-flex; flex-wrap: wrap; align-self: flex-start; background: #FFFFFF; border: 1px solid #C9DDDD; border-radius: 26px; padding: 5px; gap: 4px" role="group" aria-label="Especialidade">
<sc-for list="{{specs}}" as="sp" hint-placeholder-count="3">
<sc-if value="{{sp.active}}" hint-placeholder-val="{{ false }}"><button class="btn" type="button" aria-pressed="true" style="background: #1D304E; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 999px; min-height: 44px">{{sp.label}}</button></sc-if>
<sc-if value="{{sp.inactive}}" hint-placeholder-val="{{ true }}"><button class="btn" type="button" aria-pressed="false" onClick="{{sp.pick}}" style="background: transparent; color: #3E5068; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 999px; min-height: 44px">{{sp.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<a href="#demo" style="background: #1D304E; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px; padding: 16px 26px; border-radius: 999px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center">Ver a plataforma por dentro</a>
<a href="{{c.waHref}}" target="_blank" rel="noopener" style="background: #FFFFFF; color: #1D304E; text-decoration: none; font-weight: 700; font-size: 16px; padding: 16px 26px; border-radius: 999px; border: 1px solid #C7D1DE; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center">Falar no WhatsApp</a>
</div>
</div>

<!-- devices -->
<div style="position: relative; padding: 0 0 40px 60px">

<div style="width: 100%; background: #0B1422; border-radius: 18px 18px 0 0; padding: 12px 12px 14px; box-sizing: border-box; box-shadow: 0 30px 60px rgba(29,48,78,0.25)">

<span style="font-size: 10px; color: #B5C2D6; padding: 6px">Painel</span>

</div>

<span style="font-size: 8px; font-weight: 700; padding: 3px 6px; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}; white-space: nowrap">{{s.st}}</span>
</div>
</sc-for>
<div style="background: #0F1B2E; border-radius: 7px; padding: 8px 10px; display: flex; gap: 8px; align-items: center">
<span style="font-size: 8px; font-weight: 800; color: #0B1A2E; background: #3CC7BE; padding: 2px 6px; border-radius: 4px">CONSELHEIRO</span>

</div>

</div>

</div>
</div>
</div>

</div>
</div>

/* Mini runtime: renders the demo template (sc-if, sc-for, {{holes}}, onClick) */
(function(){
  function get(ctx, path){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return parseFloat(path);
    return path.split('.').reduce(function(o,k){ return o == null ? undefined : o[k]; }, ctx);
  }
  function interp(str, ctx){ return str.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(ctx, p); return v == null ? '' : v; }); }
  function whole(str){ var m = str.match(/^\s*\{\{([^}]+)\}\}\s*$/); return m ? m[1] : null; }
  function proc(node, ctx){
    if (node.nodeType === 3){ if (node.nodeValue.indexOf('{{') >= 0) node.nodeValue = interp(node.nodeValue, ctx); return [node]; }
    if (node.nodeType !== 1) return [node];
    var tag = node.tagName.toLowerCase();
    if (tag === 'sc-if'){
      if (!get(ctx, whole(node.getAttribute('value')))) return [];
      return procKids(node, ctx);
    }
    if (tag === 'sc-for'){
      var list = get(ctx, whole(node.getAttribute('list'))) || [], as = node.getAttribute('as'), out = [];
      list.forEach(function(item, i){
        var c = Object.create(ctx); c[as] = item; c.$index = i;
        var clone = node.cloneNode(true);
        out = out.concat(procKids(clone, c));
      });
      return out;
    }
    Array.prototype.slice.call(node.attributes).forEach(function(a){
      if (a.value.indexOf('{{') < 0 || /^hint-/.test(a.name)) { if (/^hint-/.test(a.name)) node.removeAttribute(a.name); return; }
      if (/^on/i.test(a.name)){
        var fn = get(ctx, whole(a.value)); node.removeAttribute(a.name);
        var ev = a.name.slice(2).toLowerCase(); if (ev === 'change') ev = 'input';
        if (typeof fn === 'function') node.addEventListener(ev, fn);
        return;
      }
      node.setAttribute(a.name, interp(a.value, ctx));
    });
    var kids = Array.prototype.slice.call(node.childNodes);
    kids.forEach(function(k){
      var res = proc(k, ctx);
      if (res.length === 1 && res[0] === k) return;
      res.forEach(function(r){ node.insertBefore(r, k); });
      node.removeChild(k);
    });
    return [node];
  }
  function procKids(node, ctx){
    var out = [];
    Array.prototype.slice.call(node.childNodes).forEach(function(k){ out = out.concat(proc(k, ctx)); });
    return out;
  }
  window.DCLogic = function(props){ this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function(p){ Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); if (this._render) this._render(); };
  window.mountDC = function(Comp, tplId, rootId, props){
    var inst = new Comp(props || {}), root = document.getElementById(rootId), tpl = document.getElementById(tplId);
    inst._render = function(){
      var frag = tpl.content.cloneNode(true), ctx = inst.renderVals(), wrap = document.createElement('div');
      wrap.appendChild(frag); var nodes = procKids(wrap, ctx);
      root.innerHTML = ''; nodes.forEach(function(n){ root.appendChild(n); });
    };
    inst._render(); return inst;
  };
})();
</script>

  renderVals() {
    const product = this.state.product || this.props.startSpec || 'estetica';
    const screen = this.state.screen;
    const d = this.data()[product];
    const go = (s) => () => this.setState({ screen: s });
    const navDef = [
      { id: 'painel', label: 'Painel' },
      { id: 'conversas', label: 'Conversas' },
      { id: 'funil', label: 'Funil' },
      { id: 'equipe', label: 'Equipe e metas' },
      { id: 'leitura', label: 'Leitura da semana', isAi: true },
      { id: 'conselheiro', label: 'Conselheiro', isAi: true }
    ];
    const nav = navDef.map((n) => ({ ...n, active: n.id === screen, inactive: n.id !== screen, go: go(n.id) }));
    const titles = { painel: 'Painel do dia', conversas: 'Conversas', funil: 'Funil de vendas', equipe: 'Equipe e metas', leitura: 'Leitura da semana', conselheiro: 'Pergunte ao Conselheiro' };
    const chosenId = (this.state.chosen || {})[product] || null;
    const max = Math.max(...d.bars.map((b) => b.v));
    const min = Math.min(...d.bars.map((b) => b.v));
    const bars = d.bars.map((b, i) => ({ ...b, h: Math.round(30 + (b.v - min) / Math.max(1, max - min) * 50), color: i === d.bars.length - 1 ? '#B42318' : '#6272AE' }));
    const kpis = d.kpis.map((k) => ({ ...k, bad: !k.good }));
    const alerts = d.alerts.map((a) => ({ ...a, mid: !a.high }));
    const inbox = d.inbox.map((c) => ({ ...c, active: !!c.active, inactive: !c.active }));
    const chat = d.chat.map((m) => ({ ...m, lead: !m.ia }));
    const wmax = Math.max(...d.weekly.map((w) => w.team + w.ia));
    const weekly = d.weekly.map((w) => ({ ...w, total: ((w.team + w.ia) % 1 === 0 ? String(w.team + w.ia) : (w.team + w.ia).toFixed(1).replace('.', ',')), teamH: Math.round(w.team / wmax * 150), iaH: Math.round(w.ia / wmax * 150) }));
    const team = d.team.map((t) => ({ ...t, hasMeta: t.meta > 0, noMeta: !(t.meta > 0), alertOn: !!t.alert, barColor: t.meta && t.meta < 50 ? '#B42318' : '#1D304E' }));
    const paths = d.paths.map((p) => ({
      ...p,
      isChosen: p.id === chosenId,
      notChosen: p.id !== chosenId,
      pick: () => this.setState({ chosen: { ...(this.state.chosen || {}), [product]: p.id } })
    }));
    const chosen = d.paths.find((p) => p.id === chosenId);
    return {
      d: { ...d, kpis, alerts, bars, inbox, chat, weekly, team },
      isEquipe: screen === 'equipe',
      paths,
      nav,
      specs: [{ k: 'estetica', label: 'Estética' }, { k: 'odonto', label: 'Odontologia' }, { k: 'medica', label: 'Clínica médica' }].map((x) => ({ ...x, active: x.k === product, inactive: x.k !== product, pick: () => this.setState({ product: x.k }) })),
      screenTitle: titles[screen],
      isPainel: screen === 'painel',
      isConversas: screen === 'conversas',
      isFunil: screen === 'funil',
      isLeitura: screen === 'leitura',
      isConselheiro: screen === 'conselheiro',
      goLeitura: go('leitura'),
      goConselheiro: go('conselheiro'),
      hasChosen: !!chosen,
      noChosen: !chosen,
      chosenId: chosenId || '',
      chosenAction: chosen ? chosen.action : '',
      reset: () => this.setState({ chosen: { ...(this.state.chosen || {}), [product]: null } })
    };
  }
}
